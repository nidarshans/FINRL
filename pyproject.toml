[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrl-regime-ppo"
version = "0.1.0"
description = "JAX-native regime-aware PPO portfolio optimization research framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.0",
    "numpy>=1.24",
    "polars>=1.0",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "chex>=0.1.7",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
