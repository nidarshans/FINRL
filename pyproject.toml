[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrl-score-allocation"
version = "0.1.0"
description = "JAX-native score-driven portfolio allocation research framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hmmlearn>=0.3",
    "jax>=0.4.0",
    "flax>=0.12.7",
    "numpy>=1.24",
    "optax>=0.1.7",
    "plotly>=5.0",
    "polars>=1.0",
    "scipy>=1.10",
    "setuptools<81",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "chex>=0.1.7",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
